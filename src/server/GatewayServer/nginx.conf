events {}

stream {
    log_format gateway '$remote_addr:$remote_port -> $upstream_addr '
                       'status=$status sent=$bytes_sent received=$bytes_received '
                       'duration=${session_time}s';
    access_log /dev/stdout gateway;

    upstream battle_server {
        zone battle_server 64k;
        # Match the IPv4 gateway network when Docker returns both address families.
        resolver 127.0.0.11 ipv6=off;
        server host.docker.internal:7778 resolve;
    }

    server {
        listen 7777 udp reuseport;
        proxy_pass battle_server;
        proxy_timeout 60s;
    }
}
